<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Note</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f8;
      --text: #111;
      --card: #fff;
      --accent: #007bff;
    }

    body.dark {
      --bg: #121212;
      --text: #e4e4e4;
      --card: #1e1e1e;
      --accent: #1e90ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      transition: all 0.3s ease;
    }

    #editor {
      height: 350px;
      background: var(--card);
      color: var(--text);
      border: 1px solid #ccc;
      border-radius: 10px;
      margin: 20px auto;
      width: 80%;
    }

    button {
      padding: 10px 20px;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #toggle-dark {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card);
      border: none;
      color: var(--accent);
      border-radius: 20px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="toggle-dark">🌙</button>
  <h2>Editing: {{ note.title }}</h2>
  <form method="POST" onsubmit="saveContent()">
    <input type="hidden" name="content" id="note-input">
    <div id="editor">{{ note.content|safe }}</div>
    <br>
    <button type="submit">Save</button>
  </form>
  <p><a href="/notes" style="color: var(--accent);">← Back to Notes</a></p>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script>
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          [{ align: [] }],
          ['link', 'clean']
        ]
      }
    });

    function saveContent() {
      document.getElementById('note-input').value = document.querySelector('.ql-editor').innerHTML;
    }

    // 🌓 Dark Mode
    const toggle = document.getElementById("toggle-dark");
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
    toggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const mode = document.body.classList.contains("dark") ? "dark" : "light";
      localStorage.setItem("theme", mode);
      toggle.textContent = mode === "dark" ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
