<!DOCTYPE html>
<html>
<head>
  <title>Editing {{ note.title }}</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
  <h1>📝 Editing: {{ note.title }}</h1>
  <form method="POST" onsubmit="saveContent()">
    <input type="hidden" name="content" id="note-input">
    <div id="editor">{{ note.content|safe }}</div>
    <br>
    <button type="submit">💾 Save</button>
  </form>
  <a href="/notes">← Back to Notes</a>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script>
    var quill = new Quill('#editor', { theme: 'snow' });
    function saveContent() {
      document.getElementById('note-input').value = document.querySelector('.ql-editor').innerHTML;
    }
  </script>
</body>
</html>
