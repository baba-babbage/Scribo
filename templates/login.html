<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login </title>
    <style>
        body { font-family: Arial; text-align: center; background-color: #f9fafb; }
        form { display: inline-block; padding: 20px; background: #fff; margin-top: 80px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
        input { margin: 10px; padding: 8px; width: 200px; }
        button { padding: 8px 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        a { text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <h1> SCRIBO </h1>
    <h2>Login to Your Notebook</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="/register">Register here</a></p>
</body>
</html>
