<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: Arial; text-align: center; background-color: #f9fafb; }
        form { display: inline-block; padding: 20px; background: #fff; margin-top: 80px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
        input { margin: 10px; padding: 8px; width: 200px; }
        button { padding: 8px 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
        a { text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <H1> SCRIBO </H1>
    <h2>Create a New Account</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Choose a username" required><br>
        <input type="password" name="password" placeholder="Create password" required><br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
</body>
</html>
